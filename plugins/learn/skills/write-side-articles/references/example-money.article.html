<template class="card" data-part="1" data-kind="concept">
  <p class="eyebrow">What sets the value</p>
  <h2>What decides what later money is worth today?</h2>
  <p class="line">Four things set it:</p>
  <ol class="places">
    <li><span>1</span>How much</li>
    <li><span>2</span>How long you wait</li>
    <li><span>3</span>What it earns meanwhile</li>
    <li><span>4</span>The chance it never comes</li>
  </ol>
  <p class="line mu">Change any one, and the better offer can flip.</p>
</template>

<template class="card" data-part="1" data-kind="concept">
  <p class="eyebrow">One offer, all four</p>
  <h2>How does one client offer run through all four?</h2>
  <div class="stops watch">
    <div class="stop"><span class="w">1 · How much</span><span>₹60,000 later, against ₹50,000 now</span></div>
    <div class="stop"><span class="w">2 · How long you wait</span><span>Six months</span></div>
    <div class="stop"><span class="w">3 · What it earns meanwhile</span><span>Say 7% a year in a bank deposit: ₹58,000 today</span></div>
    <div class="stop"><span class="w">4 · The chance it never comes</span><span>Say 1 in 5 such clients never pay: about ₹46,000</span></div>
  </div>
  <div class="keyline"><span class="l">Its name</span><span class="t">What later money is worth today is its <b class="name">present value</b>. ₹46,000 loses to ₹50,000 now.</span></div>
</template>

<template class="card" data-part="2" data-kind="far">
  <p class="eyebrow">Far away · bees and flowers</p>
  <h2>When should a bee leave a patch of flowers?</h2>
  <div class="board"><svg viewBox="0 0 340 200" role="img" aria-labelledby="t-far"><title id="t-far">Nectar gathered in one patch rises fast, then flattens as the flowers empty. A straight line shows the bee's usual pace elsewhere. Where the curve gets slower than that line, the bee leaves.</title>

    <text x="330" y="190" text-anchor="end" class="s-mu" font-size="13">time in patch</text>
    <path d="M60 170 C90 100 140 70 320 52" class="k-p2" stroke-width="4"/>
    <path d="M20 170 L250 50" class="k-p1" stroke-dasharray="4 7"/>
    <circle cx="176" cy="74" r="7" class="s-p2"/>
    <text x="176" y="40" text-anchor="middle" class="s-p2" font-size="15" font-weight="800">leave here</text>

<template class="card" data-part="3" data-kind="answer">
  <p class="eyebrow">The answer</p>
  <h2>How do you choose between money now and later?</h2>
  <div class="ans">
    <div class="st"><span class="sn">Step 1</span><b>Pick your rate from your cash</b>
      <div class="chips"><span>6+ months: about 7% a year</span><span>Under 3 months: about 3.75% a month</span></div></div>
    <div class="st"><span class="sn">Step 2</span><b>Bring both offers to today</b>
      <ol class="places small"><li><span>1</span>How much</li><li><span>2</span>How long</li><li><span>3</span>What it earns</li><li><span>4</span>Will it come?</li></ol></div>
  </div>
  <p class="line">That today number is its <b class="name">present value</b>. <span class="mark">Pick the bigger number today.</span></p>
  <details><summary>Sources</summary><ol>
    <li>Richard Brealey, Stewart Myers and Franklin Allen, <em>Principles of Corporate Finance</em>, chapter 2: present value, and the discount rate as the return you give up.</li>

    <li>The tool, client and amounts are made up for the example; the yearly plan's rate is computed : ₹9,000 now against eleven ₹1,000 payments is about 3.5% a month.</li>
