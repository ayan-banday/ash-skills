<!--
  MODULE constellation.html · catalogue STR-01 (constellation mind map) · prefix cst-
  Serves: one idea at the centre, 3-5 branches, 2-4 leaves each (16 leaves at most), each leaf tagged with the team that owns it.
  Adapt:
    1. Edit the heading copy in the markup and the band colour class; text halos follow the band colour on their own.
    2. Edit DATA only. Keep the centre under ~22 characters, branch names under ~14, leaf text under ~28.
    3. chip (starter chip class) colours the branch disc on the map and the branch heading in the list twin.
    4. The layout is computed (radial fan, then overlap relaxation); no coordinates to place by hand.
    5. Hover a branch (tap on touch) to dim the others and run one slow pulse along that branch; nothing moves at rest.
  Data: DATA.centre, DATA.branches [{name, chip, leaves: [{text, team}]}].
-->
<section id="cst" class="band t2" aria-labelledby="cst-h">
  <div class="wrap">
    <div class="band-head rv">
      <p class="label">The whole offer</p>
      <h2 id="cst-h">Every team, and the part of the job it owns</h2>
      <p class="lede">Four aims grow out of one goal. Each leaf names one piece of work and the Field &amp; Form team that does it.</p>
    </div>
    <svg class="cst-map cst-pre" id="cst-map" viewBox="0 0 1100 700" aria-hidden="true"></svg>
    <div class="cst-list" id="cst-list"></div>
  </div>
</section>
<style>
  /* Constellation: a radial map that grows outward from the centre */
  .cst-map{width:100%;height:auto;display:block;overflow:visible;--cst-halo:var(--paper)}
  .cst-ln{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-opacity:.55;stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset .9s var(--ease-draw)}
  .cst-map text{paint-order:stroke;stroke:var(--cst-halo);stroke-width:12px;stroke-linejoin:round;fill:var(--ink);
    transition:opacity .5s ease,transform 1.1s cubic-bezier(.19,1,.22,1)}
  .cst-map .cst-tc{font:500 34px var(--font-display);letter-spacing:-.01em}
  .cst-map .cst-tb{font:500 26px var(--font-display);letter-spacing:-.01em}
  .cst-map .cst-tl{font:500 16px var(--font-body)}
  .cst-map .cst-tt{font:500 11px var(--font-label);letter-spacing:.06em;text-transform:uppercase;fill:var(--muted)}
  .cst-dot{fill:var(--ink);transition:opacity .5s ease}
  .cst-dot.cst-db{stroke:var(--ink);stroke-width:1.6}
  .cst-dot.cst-dc{fill:var(--ink);stroke:var(--cst-halo);stroke-width:3}
  .cst-pulse{fill:var(--accent-1);pointer-events:none}
  .cst-g{transition:opacity .3s ease}
  .cst-pre .cst-ln{stroke-dashoffset:1}
  .cst-pre text{opacity:0;transform:translateY(12px)}
  .cst-pre .cst-dot{opacity:0}
  .cst-dim .cst-g:not(.cst-hot){opacity:.22}
  /* list twin: visually hidden on wide screens (screen readers still read it), the visible map below 820px */
  .cst-list{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  @media (max-width:820px){
    .cst-map{display:none}
    .cst-list{position:static;width:auto;height:auto;overflow:visible;clip-path:none;white-space:normal;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
    .cst-list-c{grid-column:1/-1;font:500 30px/1.15 var(--font-display);display:flex;align-items:center;gap:12px}
    .cst-list-c::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--ink);flex:none}
    .cst-list section{background:color-mix(in srgb,var(--card) 55%,transparent);border-radius:var(--r-sheet);padding:18px 20px;box-shadow:0 0 0 1px var(--line)}
    .cst-list h3{margin-bottom:12px}
    .cst-list h3 .chip{font-size:13px;padding:7px 11px}
    .cst-list ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
    .cst-list li{font-size:16px;line-height:1.35}
    .cst-list li .label{display:block;margin-top:2px;font-size:10.5px}
  }
</style>
<script>
(() => {
  const DATA = {
    centre: 'Fresh on every shelf',
    branches: [
      { name: 'Order right', chip: 'c-data', leaves: [
        { text: 'Weekly order forecast', team: 'Data team' },
        { text: 'Targets for each store', team: 'Data team' },
        { text: 'Order screen on the tablet', team: 'App team' } ] },
      { name: 'Keep it cold', chip: 'c-sensors', leaves: [
        { text: 'A logger in every van', team: 'Sensors team' },
        { text: 'Alerts before stock spoils', team: 'App team' },
        { text: 'Depot fridge checks', team: 'Field team' } ] },
      { name: 'Waste less', chip: 'c-app', leaves: [
        { text: 'Two-tap waste count', team: 'App team' },
        { text: 'Evening waste report', team: 'Data team' },
        { text: 'Markdowns before expiry', team: 'Field team' },
        { text: 'Food bank pick-ups', team: 'Field team' } ] },
      { name: 'Teach it', chip: 'c-field', leaves: [
        { text: 'Shift-start huddles', team: 'Field team' },
        { text: 'Short videos for new staff', team: 'App team' },
        { text: 'A playbook for store leads', team: 'Field team' } ] }
    ]
  };

  /* ---- mechanics ---- */
  const sec = $('#cst'), svg = $('#cst-map'), list = $('#cst-list');
  const W = 1100, H = 700, C = { x: 550, y: 350 };
  const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };

  // list twin, built from the same data (also what screen readers read)
  list.innerHTML = `<p class="cst-list-c">${DATA.centre}</p>` + DATA.branches.map(b =>
    `<section><h3><span class="chip ${b.chip}">${b.name}</span></h3><ul>${b.leaves.map(l => `<li>${l.text}<span class="label">${l.team}</span></li>`).join('')}</ul></section>`).join('');
  const tints = $$('h3 .chip', list).map(c => getComputedStyle(c).backgroundColor);
  svg.style.setProperty('--cst-halo', getComputedStyle(sec).backgroundColor);

  // layout: branches on an inner ellipse, leaves fanned on an outer one, then label boxes pushed apart
  const n = DATA.branches.length, boxes = [], est = (s, px) => s.length * px;
  boxes.push({ x: C.x, y: C.y, oy: -22, w: est(DATA.centre, 17) + 24, h: 72, fixed: true });
  const B = DATA.branches.map((b, i) => {
    const th = (-90 + 360 * (i + .5) / n) * Math.PI / 180, m = b.leaves.length;
    const o = { id: 'b' + i, b, x: C.x + 250 * Math.cos(th), y: C.y + 160 * Math.sin(th), oy: -16, w: est(b.name, 13.5) + 24, h: 52, fixed: true };
    boxes.push(o);
    const step = Math.min(30, .85 * 360 / n / m) * Math.PI / 180;
    o.leaves = b.leaves.map((lf, j) => {
      const ph = th + (j - (m - 1) / 2) * step;
      const q = { lf, ix: C.x + 440 * Math.cos(ph), iy: C.y + 272 * Math.sin(ph), oy: -1, w: Math.max(est(lf.text, 8.2), est(lf.team, 7.6)) + 20, h: 50 };
      q.x = q.ix; q.y = q.iy; boxes.push(q); return q;
    });
    return o;
  });
  for (let it = 0; it < 320; it++) {
    for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
      const a = boxes[i], b = boxes[j]; if (a.fixed && b.fixed) continue;
      const dx = a.x - b.x, dy = (a.y + a.oy) - (b.y + b.oy);
      const ox = (a.w + b.w) / 2 + 8 - Math.abs(dx), oy = (a.h + b.h) / 2 + 4 - Math.abs(dy);
      if (ox <= 0 || oy <= 0) continue;
      const sa = a.fixed ? 0 : b.fixed ? 1 : .5, sb = 1 - sa;
      if (oy <= ox) { const s = Math.sign(dy) || 1; a.y += s * oy * sa; b.y -= s * oy * sb; }
      else { const s = Math.sign(dx) || 1; a.x += s * ox * sa; b.x -= s * ox * sb; }
    }
    boxes.forEach(o => {
      if (o.fixed) return;
      if (it < 260) { o.x += (o.ix - o.x) * .03; o.y += (o.iy - o.y) * .03; }
      o.x = Math.min(W - o.w / 2 - 4, Math.max(o.w / 2 + 4, o.x));
      o.y = Math.min(H - o.h / 2 - 4 - o.oy, Math.max(o.h / 2 + 4 - o.oy, o.y));
    });
  }

  // draw: three layers (lines, dots, text) so text sits on top; one group per branch in each layer
  const maxD = Math.max(...boxes.map(o => Math.hypot(o.x - C.x, o.y - C.y)));
  const delay = (x, y) => .08 + .72 * Math.hypot(x - C.x, y - C.y) / maxD;   // labels land from the centre outward
  const layers = ['cst-lines', 'cst-dots', 'cst-text'].map(c => mk('g', { class: c }, svg)), groups = {};
  const grp = id => groups[id] || (groups[id] = layers.map(l => mk('g', { class: 'cst-g', 'data-g': id }, l)));
  const line = (x1, y1, x2, y2, id) => { const p = mk('path', { d: `M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}`, pathLength: 1, class: 'cst-ln' }, grp(id)[0]); p.style.transitionDelay = (delay(x1, y1) * .8).toFixed(2) + 's'; };
  const dot = (x, y, r, cls, id) => { const c = mk('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r, class: 'cst-dot ' + cls }, grp(id)[1]); c.style.transitionDelay = delay(x, y).toFixed(2) + 's'; return c; };
  const text = (x, y, s, cls, id, extra = 0) => { const t = mk('text', { x: x.toFixed(1), y: y.toFixed(1), 'text-anchor': 'middle', 'dominant-baseline': 'middle', class: cls }, grp(id)[2]); t.textContent = s; t.style.transitionDelay = (delay(x, y) + extra).toFixed(2) + 's'; };
  B.forEach((o, i) => {
    line(C.x, C.y, o.x, o.y, o.id);
    o.leaves.forEach(q => { line(o.x, o.y, q.x, q.y, o.id); dot(q.x, q.y, 3, '', o.id); text(q.x, q.y - 15, q.lf.text, 'cst-tl', o.id, .05); text(q.x, q.y + 15, q.lf.team, 'cst-tt', o.id, .12); });
    dot(o.x, o.y, 9, 'cst-db', o.id).style.fill = tints[i];
    text(o.x, o.y - 28, o.b.name, 'cst-tb', o.id);
  });
  dot(C.x, C.y, 12, 'cst-dc', 'c'); text(C.x, C.y - 40, DATA.centre, 'cst-tc', 'c');

  // hover dims the other branches (hover devices only); tap toggles on touch
  let hot = null, cur = null, wake = () => {};
  const setHot = id => { hot = id; cur = null; wake(); svg.classList.toggle('cst-dim', !!id); $$('.cst-g', svg).forEach(g => g.classList.toggle('cst-hot', g.dataset.g === id || g.dataset.g === 'c')); };
  if (matchMedia('(hover:hover)').matches) $$('.cst-g', svg).forEach(g => { if (g.dataset.g === 'c') return; g.addEventListener('mouseenter', () => setHot(g.dataset.g)); g.addEventListener('mouseleave', () => setHot(null)); });
  else svg.addEventListener('click', e => { const g = e.target.closest('.cst-g'), id = g && g.dataset.g !== 'c' ? g.dataset.g : null; setHot(id && id !== hot ? id : null); });

  onView(svg, () => svg.classList.remove('cst-pre'), .3);   // under FINAL this runs at once: drawn, every label shown
  if (FINAL) return;
  // one slow pulse, only on the branch being hovered or tapped (none at rest); it sleeps off-screen
  const pulse = mk('circle', { r: 3.4, class: 'cst-pulse', opacity: 0 }, layers[1]);
  const routes = B.flatMap(o => o.leaves.map(q => ({ id: o.id, pts: [[C.x, C.y], [o.x, o.y], [q.x, q.y]] })));
  const TRAVEL = 2600, REST = 900;
  let ri = 0, t0 = 0, raf = 0, vis = false;
  function frame(now) {
    if (!vis || !hot) { raf = 0; cur = null; pulse.setAttribute('opacity', 0); return; }
    if (!cur || now - t0 > TRAVEL + REST) { const pool = routes.filter(r => r.id === hot); cur = pool[ri++ % pool.length]; t0 = now; }
    const u = Math.min(1, (now - t0) / TRAVEL), [p0, p1, p2] = cur.pts;
    const l1 = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), l2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    let d = u * (l1 + l2), a = p0, b = p1, len = l1;
    if (d > l1) { d -= l1; a = p1; b = p2; len = l2; }
    pulse.setAttribute('cx', (a[0] + (b[0] - a[0]) * d / len).toFixed(1));
    pulse.setAttribute('cy', (a[1] + (b[1] - a[1]) * d / len).toFixed(1));
    pulse.setAttribute('opacity', u < 1 ? (Math.sin(Math.PI * u) * .9).toFixed(2) : 0);
    raf = requestAnimationFrame(frame);
  }
  wake = () => { if (vis && hot && !raf) raf = requestAnimationFrame(frame); };
  new IntersectionObserver(([e]) => { vis = e.isIntersecting; wake(); }).observe(svg);
})();
</script>
