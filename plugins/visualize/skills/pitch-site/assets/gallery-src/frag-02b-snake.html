<!--
  MODULE snake.html · catalogue SEQ-01 (snake: a scroll-drawn path through problem stops) · prefix snk-
  Serves: a chain of 3-6 problems, each taken on by one team with one concrete outcome, ending in one result.
  Adapt:
    1. Edit the heading copy in the markup (label, h2, lede) and the band colour class on the section.
    2. Edit DATA only: one stop per problem, in reading order. Keep each problem to one sentence.
    3. chip is a starter chip class (c-sensors, c-app, c-data, c-field); team is the name printed on it.
    4. gets and end.text may hold one <mark> each for the takeaway. Mechanics below DATA stay as they are.
  Data: DATA.problemLabel, DATA.getsLabel, DATA.stops [{problem, team, chip, does, gets}], DATA.end {label, text}.
-->
<section id="snk" class="band paper" aria-labelledby="snk-h">
  <div class="wrap">
    <div class="band-head rv">
      <p class="label">What goes wrong today</p>
      <h2 id="snk-h">Four problems, and the team that takes on each one</h2>
      <p class="lede">Follow the line down. Each stop is a problem Northwind Foods named, the team that fixes it, and what changes in the stores.</p>
    </div>
    <div class="snk" id="snk-path">
      <svg class="snk-line" aria-hidden="true"><path class="snk-base"/><path class="snk-ink"/></svg>
    </div>
  </div>
</section>
<style>
  /* Snake: problem-first stops zig-zag down; one line weaves through their knots as you scroll */
  .snk{position:relative;display:flex;flex-direction:column;gap:30px}
  .snk-line{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
  .snk-line path{fill:none;stroke-linecap:round}
  .snk-base{stroke:var(--ink);stroke-opacity:.24;stroke-width:2;stroke-dasharray:1 8}
  .snk-ink{stroke:var(--ink);stroke-width:2.4}
  .snk-stop{position:relative;z-index:1;width:calc(50% - 70px);background:var(--card);border-radius:var(--r-sheet);padding:26px 28px 24px;
    box-shadow:0 0 0 1px var(--line),0 16px 30px -26px color-mix(in srgb,var(--ink) 55%,transparent)}
  .snk-stop.snk-r{align-self:flex-end}
  .snk-knot{position:absolute;top:30px;width:36px;height:36px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 2px var(--ink);
    display:grid;place-items:center;font:500 13px/1 var(--font-label);color:var(--ink);transition:background-color .4s var(--ease-out),color .4s var(--ease-out)}
  .snk-l .snk-knot{right:-18px} .snk-r .snk-knot{left:-18px}
  .snk-stop.snk-lit .snk-knot{background:var(--ink);color:var(--paper)}   /* lit = ink; the marker is kept for what the reader gets */
  .snk-k{color:var(--accent-1)}
  .snk-prob{font:500 clamp(22px,2vw,27px)/1.22 var(--font-display);letter-spacing:-.01em;margin:6px 0 16px}
  .snk-stop .chip{font-size:13px;padding:7px 11px}
  .snk-does{font-size:15px;line-height:1.5;color:var(--muted);margin-top:10px}
  .snk-gets{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .snk-gets .label{display:block;margin-bottom:6px}
  .snk-gets p{font:500 19.5px/1.45 var(--font-display)}
  .snk-end{position:relative;z-index:1;align-self:center;text-align:center;max-width:560px;background:var(--ground);color:var(--paper);
    border-radius:var(--r-sheet);padding:24px 30px}
  .snk-end .label{color:color-mix(in srgb,var(--paper) 72%,transparent)}
  .snk-end p{font:500 23px/1.3 var(--font-display);margin-top:6px}
  .snk-end mark{background-image:linear-gradient(var(--marker),var(--marker));background-position:0 0;background-size:0% 100%;color:var(--ink);border-radius:3px;padding:1px 5px}
  .snk-end.in mark{background-size:100% 100%}
  @media (max-width:820px){
    .snk .snk-stop,.snk .snk-end{width:auto;margin-left:46px;align-self:stretch}
    .snk .snk-end{text-align:left}
    .snk .snk-stop .snk-knot{left:-64px;right:auto}
  }
</style>
<script>
(() => {
  const DATA = {
    problemLabel: 'The problem',
    getsLabel: 'What Northwind gets',
    stops: [
      { problem: 'Store managers order by feel, so fresh lines run out by Thursday.', team: 'Data team', chip: 'c-data',
        does: 'Builds a weekly order forecast from two years of till data.', gets: '<mark>Shelves that stay full</mark> through the weekend.' },
      { problem: 'Chilled vans keep no record of how cold they stayed.', team: 'Sensors team', chip: 'c-sensors',
        does: 'Fits a small logger in each van that reports every five minutes.', gets: 'A <mark>temperature trail for every delivery</mark>.' },
      { problem: 'Waste is counted on paper and typed up a week late.', team: 'App team', chip: 'c-app',
        does: 'Puts the waste count on the store tablet, two taps per item.', gets: '<mark>Same-day waste numbers</mark> for every store.' },
      { problem: 'Head office cannot see which stores need help first.', team: 'Field team', chip: 'c-field',
        does: 'Visits the five worst-hit stores and fixes the routine on the floor.', gets: 'A <mark>fix the store staff keep doing</mark>.' }
    ],
    end: { label: 'Where this leads', text: 'Less food thrown away, and <mark>full shelves on Saturday</mark>.' }
  };

  /* ---- mechanics: build the stops, then draw the line from measured knot centres ---- */
  const root = $('#snk-path'), svg = $('.snk-line', root), base = $('.snk-base', root), ink = $('.snk-ink', root);
  DATA.stops.forEach((s, i) => {
    const a = document.createElement('article');
    a.className = 'snk-stop rv ' + (i % 2 ? 'snk-r' : 'snk-l');
    a.innerHTML = `<span class="snk-knot" aria-hidden="true">${i + 1}</span><p class="label snk-k">${DATA.problemLabel}</p>` +
      `<h3 class="snk-prob">${s.problem}</h3><p class="chips"><span class="chip ${s.chip}">${s.team}</span></p>` +
      `<p class="snk-does">${s.does}</p><div class="snk-gets"><span class="label">${DATA.getsLabel}</span><p>${s.gets}</p></div>`;
    root.appendChild(a);
  });
  const end = document.createElement('div');
  end.className = 'snk-end rv';
  end.innerHTML = `<span class="label">${DATA.end.label}</span><p>${DATA.end.text}</p>`;
  root.appendChild(end);

  const stops = $$('.snk-stop', root), narrowMQ = matchMedia('(max-width:820px)');
  let L = 0, h = 1, lut = [], ys = [], active = !('IntersectionObserver' in window), queued = false;
  // offsets ignore the .rv translate, so the path is measured where the cards will settle
  const centreOf = el => { let x = el.offsetWidth / 2, y = el.offsetHeight / 2, n = el; while (n && n !== root) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; } return [x, y]; };
  function build() {
    const W = root.offsetWidth; h = root.offsetHeight;
    if (!W || !h) return;
    svg.setAttribute('viewBox', `0 0 ${W} ${h}`);
    const narrow = narrowMQ.matches;
    const pts = stops.map(s => centreOf($('.snk-knot', s)));
    pts.push(narrow ? [pts[0][0], end.offsetTop + 28] : [end.offsetLeft + end.offsetWidth / 2, end.offsetTop]);
    let d = `M${pts[0][0]} ${pts[0][1] - 40}L${pts[0][0]} ${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], dy = y1 - y0, w = narrow ? (i % 2 ? 14 : -14) : 0;
      d += `C${x0 + w} ${y0 + dy * .55} ${x1 - w} ${y1 - dy * .55} ${x1} ${y1}`;
    }
    base.setAttribute('d', d); ink.setAttribute('d', d);
    L = ink.getTotalLength(); ink.style.strokeDasharray = `${L} ${L}`;
    // y -> length table, so the ink tip sits exactly at the reach line and knots light as it passes them
    lut = []; for (let i = 0; i <= 240; i++) { const l = L * i / 240; lut.push([ink.getPointAtLength(l).y, l]); }
    ys = pts.slice(0, stops.length).map(p => p[1]);
    draw();
  }
  const lenAt = y => {
    if (y <= lut[0][0]) return 0;
    for (let i = 1; i < lut.length; i++) if (lut[i][0] >= y) { const [y0, l0] = lut[i - 1], [y1, l1] = lut[i]; return l0 + (l1 - l0) * (y1 > y0 ? (y - y0) / (y1 - y0) : 1); }
    return L;
  };
  function draw() {
    queued = false;
    if (!L) return;
    if (FINAL) { ink.style.strokeDashoffset = 0; stops.forEach(s => s.classList.add('snk-lit')); return; }
    const top = root.getBoundingClientRect().top;                       // the one layout read per frame
    const reach = Math.max(0, Math.min(h, innerHeight * .62 - top));    // reach = clamp(0, h, innerHeight*.62 - top)
    ink.style.strokeDashoffset = L - lenAt(reach);
    stops.forEach((s, i) => s.classList.toggle('snk-lit', reach >= ys[i] - 4));
  }
  const request = () => { if (active && !queued) { queued = true; requestAnimationFrame(draw); } };
  addEventListener('scroll', request, { passive: true });
  if ('IntersectionObserver' in window) new IntersectionObserver(([e]) => { active = e.isIntersecting; request(); }, { rootMargin: '25% 0px' }).observe(root);
  if ('ResizeObserver' in window) new ResizeObserver(() => requestAnimationFrame(build)).observe(root);
  else { addEventListener('resize', build); addEventListener('load', build); }
  build();
})();
</script>
