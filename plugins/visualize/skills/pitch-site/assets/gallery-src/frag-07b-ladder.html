<!--
  MODULE ladder.html · catalogue STR-17 (layers ladder) · prefix lad-
  Serves: one offer that differs by level (3-5 ordered levels, senior at the top), saying what each level gets.
  Adapt:
    1. Edit the heading copy in the markup and the band colour class.
    2. Edit DATA only: levels top first. level is a short role name; gets is one line with one <mark> on what they get.
    3. On entry a spine rises from the bottom level and each level turns ink as the spine reaches it, then its
       marker sweeps. Under ?final=1 every level is lit and swept.
  Data: DATA.heads [who, what], DATA.levels [{level, gets}].
-->
<section id="lad" class="band t3" aria-labelledby="lad-h">
  <div class="wrap">
    <div class="band-head rv">
      <p class="label">Who gets what</p>
      <h2 id="lad-h">Built from the shop floor up</h2>
      <p class="lede">Every level of Northwind gets something it can use on Monday. The work starts with the people who stack the shelves.</p>
    </div>
    <div class="lad" id="lad">
      <span class="lad-spine" id="lad-spine" aria-hidden="true"></span>
      <p class="lad-heads" id="lad-heads" aria-hidden="true"></p>
      <ol class="lad-rows" id="lad-rows"></ol>
    </div>
  </div>
</section>
<style>
  /* Ladder: a spine rises and lights each level from the bottom */
  .lad{position:relative;max-width:880px;padding-left:46px}
  .lad-spine{position:absolute;left:14px;width:2px;background:var(--ink);transform-origin:bottom;transform:scaleY(1)}
  .lad-heads{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:0 22px 10px}
  .lad-heads span{font:500 11px/1.3 var(--font-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .lad-rows{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  .lad-row{position:relative;display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center;padding:18px 22px;border-radius:var(--r-sheet);
    background:color-mix(in srgb,var(--card) 55%,transparent);box-shadow:0 0 0 1px var(--line)}
  .lad-row::before{content:"";position:absolute;left:-38px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--paper);
    box-shadow:0 0 0 2px var(--ink);transition:background-color .4s var(--ease-out)}
  .lad-row.lad-lit::before{background:var(--ink)}   /* lit = ink; the marker is kept for what the level gets */
  .lad-who{font:500 12px/1.35 var(--font-label);letter-spacing:.06em;text-transform:uppercase}
  .lad-what{font:500 20px/1.35 var(--font-display)}
  @media (max-width:820px){ .lad-heads{display:none} .lad-row{grid-template-columns:minmax(0,1fr);gap:4px} }
</style>
<script>
(() => {
  const DATA = {
    heads: ['Who', 'What they get'],
    levels: [
      { level: 'Regional directors', gets: 'A <mark>one-page waste view</mark> for every region, every Monday.' },
      { level: 'Store managers', gets: 'An order list that <mark>fills itself in</mark> each morning.' },
      { level: 'Shift leads', gets: 'A <mark>five-minute huddle plan</mark> for the start of each shift.' },
      { level: 'Shelf staff', gets: '<mark>Two taps</mark> to log anything thrown away.' }
    ]
  };

  /* ---- mechanics ---- */
  const lad = $('#lad'), spine = $('#lad-spine'), list = $('#lad-rows');
  $('#lad-heads').innerHTML = DATA.heads.map(h => `<span>${h}</span>`).join('');
  list.innerHTML = DATA.levels.map(l => `<li class="lad-row"><span class="lad-who">${l.level}</span><span class="lad-what">${l.gets}</span></li>`).join('');
  const rows = $$('.lad-row', list);
  // the spine runs exactly from the top dot to the bottom dot (offsets ignore transforms)
  const centreY = r => r.offsetTop + r.offsetHeight / 2;   // rows are positioned, so offsetTop is measured from .lad
  const place = () => { if (!rows.length) return; spine.style.top = centreY(rows[0]) + 'px'; spine.style.height = Math.max(0, centreY(rows[rows.length - 1]) - centreY(rows[0])) + 'px'; };
  if ('ResizeObserver' in window) new ResizeObserver(place).observe(list); place();
  const light = r => r.classList.add('lad-lit', 'in');      // .in plays the starter's marker sweep
  if (FINAL) { rows.forEach(light); return; }
  spine.style.transform = 'scaleY(0)';
  onView(lad, () => {
    spine.style.transition = 'transform 2.4s var(--ease-draw) .3s';
    requestAnimationFrame(() => { spine.style.transform = 'scaleY(1)'; });
    light(rows[rows.length - 1]);
    // read the spine's live scale once per frame and light each level as the spine passes its dot
    const H = spine.offsetHeight || 1, top = spine.offsetTop;
    const fr = rows.map(r => (top + H - centreY(r)) / H);
    const tick = () => {
      const m = getComputedStyle(spine).transform, sy = m.startsWith('matrix(') ? +m.slice(7, -1).split(',')[3] : 1;
      rows.forEach((r, i) => { if (sy >= fr[i] - .01) light(r); });
      if (sy < .999) requestAnimationFrame(tick); else rows.forEach(light);
    };
    requestAnimationFrame(tick);
  }, .4);
})();
</script>
