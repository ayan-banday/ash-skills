<!--
  MODULE start-portrait.html · catalogue PPL-28 (pictured start steps) + PPL-01 (portrait in the motif's line) + PPL-27 (contact card with copy) · prefix srt-
  Serves: the close: three small first steps (pick one option, meet one person, get one draft), then one named person to write to.
  Adapt:
    1. Edit the heading copy in the markup; keep the band dark (the portrait is a powder line on the ground colour).
    2. Edit DATA only. Step 1 needs options (3-4 short lines) and picked (the index the pen ring circles);
       steps 2 and 3 use the person and doc pictures as they are. Keep each step text to two lines.
    3. contact: the person's name, one line on what to send, and the email (shown as selectable text and copied by the button).
    4. The portrait is a generic line face inside a two-strand braid of dots; swap the PORTRAIT path list only if the
       person has approved a likeness.
  Data: DATA.steps [{kicker, title, text, pic, caption?, options?, picked?}] (3), DATA.contact {kicker, name, line, email, copy, copied, fallback}.
-->
<section id="srt" class="band dark" aria-labelledby="srt-h">
  <div class="wrap">
    <div class="band-head rv">
      <p class="label">How we start</p>
      <h2 id="srt-h">Three steps to working together</h2>
      <p class="lede">It starts with one store group and one person. Here is what happens after you pick.</p>
    </div>
    <div class="srt-steps" id="srt-steps"></div>
    <div class="srt-card rv" id="srt-card">
      <div class="srt-face" aria-hidden="true"><svg id="srt-portrait" viewBox="0 0 200 200"></svg></div>
      <div class="srt-who">
        <span class="label" id="srt-kicker"></span>
        <h3 id="srt-name"></h3>
        <p id="srt-line"></p>
        <div class="srt-mail"><span class="srt-addr" id="srt-addr"></span><button type="button" class="btn srt-copy" id="srt-copy"></button></div>
      </div>
    </div>
  </div>
</section>
<style>
  /* Start: three pictured steps on the dark band */
  .srt-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .srt-step{background:color-mix(in srgb,var(--paper) 6%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--paper) 14%,transparent);border-radius:var(--r-sheet);padding:26px}
  .srt-step h3{font:500 26px/1.12 var(--font-display);margin:10px 0 8px;color:var(--paper)}
  .srt-step > p{color:color-mix(in srgb,var(--paper) 82%,transparent);font-size:16px}
  .srt-pic{height:160px;border-radius:12px;background:color-mix(in srgb,var(--paper) 6%,transparent);margin-bottom:20px;display:grid;place-items:center;align-content:center;padding:14px;text-align:center}
  .srt-pic svg{width:130px;height:96px;overflow:visible}
  .srt-pic .label{margin-top:6px}
  .srt-pick{justify-items:start;text-align:left;gap:7px;padding:14px 30px}
  .srt-pick p{font-size:13.5px;color:color-mix(in srgb,var(--paper) 72%,transparent);position:relative}
  .srt-pick .srt-picked{color:var(--paper);font-weight:600}
  .srt-picked svg{position:absolute;left:-16px;top:-13px;overflow:visible;max-width:none}
  .srt-ring{fill:none;stroke:var(--paper);stroke-width:2.6;stroke-linecap:round}
  .srt-person .srt-bg{fill:var(--tint-1)}
  .srt-person path,.srt-person circle:not(.srt-bg){fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
  .srt-person .srt-sig{stroke:var(--paper)}
  .srt-doc path{fill:none;stroke:var(--paper);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .srt-doc .srt-tick{stroke:var(--marker);stroke-width:3}   /* the draft is what the reader gets, so it alone takes the marker */
  /* Contact card: portrait, name, one line, the email and a copy button */
  .srt-card{margin-top:44px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:32px;align-items:center;background:var(--card);color:var(--ink);
    border-radius:calc(var(--r-sheet) + 6px);padding:30px 34px;max-width:820px}
  .srt-face svg{width:150px;height:150px;display:block;border-radius:50%;box-shadow:0 0 0 1px var(--line),0 14px 30px -18px color-mix(in srgb,var(--ink) 60%,transparent)}
  .band.dark .srt-card .label{color:var(--muted)}
  .srt-card h3{font-size:clamp(32px,3.4vw,44px);margin:4px 0 6px}
  .srt-card p{font-size:17px}
  .srt-mail{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
  .srt-addr{font:400 15px/1.3 var(--font-label);-webkit-user-select:all;user-select:all;background:var(--paper);padding:10px 13px;border-radius:10px;box-shadow:0 0 0 1px var(--line);overflow-wrap:anywhere}
  .srt-copy:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  @media (max-width:820px){ .srt-steps{grid-template-columns:minmax(0,1fr)} .srt-card{grid-template-columns:minmax(0,1fr);padding:24px} }
</style>
<script>
(() => {
  const DATA = {
    steps: [
      { kicker: 'Step 1', title: 'Choose one store group', text: 'Pick the group where waste hurts most. For example, the city centre stores.',
        pic: 'pick', options: ['Coastal stores', 'City centre stores', 'Out-of-town stores'], picked: 1 },
      { kicker: 'Step 2', title: 'Meet one person', text: 'Field & Form gives you one contact who visits your stores and listens first.', pic: 'person', caption: 'One person, one to one' },
      { kicker: 'Step 3', title: 'Get a draft plan', text: 'Your contact sends a short plan and the changes it needs. You shape it from there.', pic: 'doc', caption: 'Draft plan' }
    ],
    contact: { kicker: 'Your Field & Form contact', name: 'Sam Ortiz', line: 'Write to Sam with the one store group you want to start with.',
      email: 'sam.ortiz@fieldandform.example', copy: 'Copy email', copied: 'Copied', fallback: 'Select and copy' }
  };

  /* ---- mechanics: the steps ---- */
  const RING = 'M150 6C70 4 8 14 8 36s70 30 146 28 142-8 140-30S220 4 128 10';   // an open pen loop that overshoots its start
  const PICS = {
    pick: s => s.options.map((o, i) => i === s.picked ? `<p class="srt-picked">${o}<svg aria-hidden="true"><path class="srt-ring"/></svg></p>` : `<p>${o}</p>`).join(''),
    person: s => `<svg viewBox="0 0 160 120"><circle class="srt-bg" cx="80" cy="60" r="52"/><circle cx="80" cy="48" r="17"/><path d="M48 104c4-22 16-32 32-32s28 10 32 32"/><path class="srt-sig" d="M140 30l10-8M144 46h12M140 62l10 8"/></svg><p class="label">${s.caption}</p>`,
    doc: s => `<svg viewBox="0 0 160 120"><path d="M46 10h52l18 18v84H46z"/><path d="M98 10v18h18"/><path d="M58 40h36M58 54h46M58 68h40M58 82h28"/><path class="srt-tick" d="M62 98l6 6 12-12"/></svg><p class="label">${s.caption}</p>`
  };
  $('#srt-steps').innerHTML = DATA.steps.map((s, i) =>
    `<div class="srt-step rv" style="--d:${(i * .1).toFixed(1)}s"><div class="srt-pic srt-${s.pic}" aria-hidden="true">${PICS[s.pic](s)}</div>` +
    `<span class="label">${s.kicker}</span><h3>${s.title}</h3><p>${s.text}</p></div>`).join('');
  // the pen ring is rebuilt at the chosen line's real size, so it never stretches and its length is exact
  const picked = $('.srt-picked');
  if (picked) {
    const rs = $('svg', picked), ring = $('path', rs);
    let drawn = FINAL;
    const size = () => {
      const w = picked.offsetWidth + 32, h = picked.offsetHeight + 26; if (w < 40) return;
      let k = 0; ring.setAttribute('d', RING.replace(/-?\d*\.?\d+/g, n => (+n * (k++ % 2 ? h / 70 : w / 300)).toFixed(1)));
      rs.setAttribute('viewBox', `0 0 ${w} ${h}`); rs.style.width = w + 'px'; rs.style.height = h + 'px';
      const L = ring.getTotalLength(); ring.dataset.len = L; ring.style.strokeDasharray = `${L} ${L}`;
      if (drawn) ring.style.strokeDashoffset = 0; else if (!ring.style.transition) ring.style.strokeDashoffset = L;
    };
    size();
    if ('ResizeObserver' in window) new ResizeObserver(size).observe(picked);
    onView(picked.closest('.srt-step'), () => { drawn = true; penDraw([ring], { delay: .3, min: 1.1 }); }, .5);
  }

  /* ---- the contact card ---- */
  const C = DATA.contact, btn = $('#srt-copy'), addr = $('#srt-addr');
  $('#srt-kicker').textContent = C.kicker; $('#srt-name').textContent = C.name; $('#srt-line').textContent = C.line;
  addr.textContent = C.email; btn.textContent = C.copy;
  let reset = 0;
  const say = ok => { btn.textContent = ok ? C.copied : C.fallback; clearTimeout(reset); reset = setTimeout(() => { btn.textContent = C.copy; }, 1800); };
  const select = () => { const r = document.createRange(); r.selectNodeContents(addr); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  btn.addEventListener('click', () => {
    try { navigator.clipboard.writeText(C.email).then(() => say(true), () => { select(); say(false); }); }
    catch (e) { select(); say(false); }
  });

  /* ---- the portrait: one powder line inside a two-strand braid of dots, drawn on like the hero ---- */
  const s = $('#srt-portrait');
  const mk = (tag, a, p = s) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const f = mk('filter', { id: 'srt-powder', x: '-5%', y: '-5%', width: '110%', height: '110%' }, mk('defs', {}));
  mk('feTurbulence', { type: 'fractalNoise', baseFrequency: '.05', numOctaves: 2, seed: 9, result: 'w' }, f);
  mk('feDisplacementMap', { in: 'SourceGraphic', in2: 'w', scale: 2.6, xChannelSelector: 'R', yChannelSelector: 'G', result: 'h' }, f);
  mk('feTurbulence', { type: 'fractalNoise', baseFrequency: '1.2', numOctaves: 1, seed: 4, result: 'g' }, f);
  mk('feDisplacementMap', { in: 'h', in2: 'g', scale: 1.4, xChannelSelector: 'R', yChannelSelector: 'G', result: 'gr' }, f);
  mk('feGaussianBlur', { in: 'gr', stdDeviation: .55, result: 'so' }, f);
  const fm = mk('feMerge', {}, f); mk('feMergeNode', { in: 'so' }, fm); mk('feMergeNode', { in: 'gr' }, fm);
  mk('circle', { cx: 100, cy: 100, r: 99, style: 'fill:var(--ground)' });
  const g = mk('g', { filter: 'url(#srt-powder)', fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', style: 'stroke:var(--paper)' });
  const lines = [], line = (d, w) => { lines.push(mk('path', { d, 'stroke-width': w }, g)); };
  const N = 12, R = 84, A = 7;                       // braid: r = 84 + 7 sin(12t + phase), phase 0 and pi
  for (const ph of [0, Math.PI]) {
    let d = '';
    for (let i = 0; i <= 240; i++) { const t = i / 240 * Math.PI * 2, r = R + A * Math.sin(N * t + ph); d += (i ? 'L' : 'M') + (100 + r * Math.cos(t)).toFixed(1) + ' ' + (100 + r * Math.sin(t)).toFixed(1); }
    line(d + 'Z', 2);
  }
  for (let i = 0; i < N; i++) { const t = (i + .5) / N * Math.PI * 2 + Math.PI / (2 * N); mk('circle', { cx: (100 + R * Math.cos(t)).toFixed(1), cy: (100 + R * Math.sin(t)).toFixed(1), r: 1.8, style: 'fill:var(--paper);stroke:none' }, g); }
  const PORTRAIT = [
    ['M50 170C56 140 76 128 100 128S144 140 150 170', 3], ['M91 113V128M109 113V128', 3], ['M88 131L100 145L112 131', 2.4],
    ['M100 117C86 117 77 104 77 88C77 72 87 61 100 61S123 72 123 88C123 104 114 117 100 117Z', 3], ['M78 82C82 66 95 59 110 62C118 64 123 71 123 80', 2.6],
    ['M101 61C97 67 91 71 84 73', 2.2], ['M76 90C72 90 72 99 77 100M124 90C128 90 128 99 123 100', 2.2], ['M87 89Q91.5 86 96 89M104 89Q108.5 86 113 89', 2],
    ['M100 92L98 99L101 100', 1.8], ['M94 106Q100 109 106 106', 2]
  ];
  PORTRAIT.forEach(([d, w]) => line(d, w));
  mk('circle', { cx: 100, cy: 157, r: 6, style: 'fill:var(--accent-1);stroke:var(--paper);stroke-width:1.5' });   // the knot at the chest
  prepDraw(lines);
  if (!FINAL) onView(s, () => lines.forEach((p, i) => {
    p.style.transition = `stroke-dashoffset ${i < 2 ? 2.2 : 1.1}s var(--ease-draw) ${i < 2 ? i * .25 : .6 + (i - 2) * .22}s`;
    requestAnimationFrame(() => { p.style.strokeDashoffset = 0; });
  }), .5);
})();
</script>
