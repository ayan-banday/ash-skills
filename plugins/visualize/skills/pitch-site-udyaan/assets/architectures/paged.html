<!-- =====================================================================
  ARCHITECTURE SHELL: PAGED, "the paper deck"
  Copy to work/frag-00-arch.html so it loads before every section. Sections stay as they are.

  - Every top-level <section> in <main> becomes one sheet of paper resting on the direction's dark ground,
    one sheet at a time. The sheet keeps the section's own background (its band colour).
  - Reader controls: Next and Previous (bottom right), arrow keys, PageUp/PageDown, Space, Home/End, swipe.
    Counter "03 / 09". Deep links: #page-3, or #<id> of anything inside a sheet (plain anchors).
  - Builds: an element with data-step="1".."n" inside a sheet stays hidden until Next shows it, in order,
    before the deck turns. Back steps backwards; a sheet reached by going back shows every step.
    (A pinned stage also writes data-step: never use a pinned stage with this shell. The sheet is the stage.)
  - Fit: a sheet taller than the screen tries tighter type, a narrower column, then head beside visual
    (the data-cps-fit levels below). If nothing fits, it scrolls inside itself and Next reads "More".
    Section-specific fit rules go in their own fragment (work/frag-00-fit.html, scoped html.arch-paged #id),
    never in this file. Set --cps-split:no on a section there to rule out head beside visual.
  - Events, dispatched on the section and bubbling:
      cps:enter {index, total, dir}   the sheet became current      cps:leave {index, total, dir}
      cps:step  {step, steps}         a build step changed (also sent on enter for a sheet with steps)
    onView and .rv work unchanged: waiting sheets sit off screen, so IntersectionObserver fires when their
    sheet arrives. Scrolling inside a sheet is forwarded as a window scroll event.
  - window.CPS = {arch, go(n), next(), prev(), index()}  (n is 0-based)
  - FINAL (?final=1 or reduced motion): sheets stacked vertically on the ground, every step shown, no controls.
    The starter's phone gate still applies. Print: one sheet per page.
  ===================================================================== -->
<style>
  html.arch-paged{--pg-m:clamp(10px,1.4vw,18px);--pg-bar:64px;--pg-desk:var(--ground);
    --pg-shadow:0 0 0 1px rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.3),0 22px 48px -24px rgba(0,0,0,.75);
    --pg-lift:0 0 0 1px rgba(255,255,255,.05),0 3px 6px rgba(0,0,0,.25),0 40px 70px -28px rgba(0,0,0,.85)}
  /* the desk sits a shade below the ground, so a dark sheet still reads as paper on it */
  @supports (color:color-mix(in srgb,red,blue)){html.arch-paged{--pg-desk:color-mix(in srgb,var(--ground) 68%,#000)}}
  html.arch-paged body{background:var(--pg-desk)}

  /* ---- Every sheet, deck or stacked ---- */
  html.arch-paged main > section{display:flex;flex-direction:column;border-radius:var(--r-sheet,3px);box-shadow:var(--pg-shadow)}
  :where(html.arch-paged main > section){background-color:var(--paper)}
  html.arch-paged main > section > *{flex-shrink:0}
  html.arch-paged main > section > .wrap{width:100%}
  /* content shorter than the sheet sits in its middle; taller content starts at the top and scrolls */
  html.arch-paged main > section::before,html.arch-paged main > section::after{content:"";flex:1 0 0px}
  html.arch-paged main > section.band{padding-top:clamp(32px,6vh,60px) !important;padding-bottom:clamp(32px,6vh,60px) !important}
  html.arch-paged main > section .band-head{margin-bottom:clamp(22px,3.6vh,40px)}

  /* ---- Deck: one sheet at a time ---- */
  html.pg-deck,html.pg-deck body{overscroll-behavior:none}
  html.pg-deck main{position:fixed;inset:0;overflow:hidden;overflow:clip}
  html.pg-deck main > section{position:absolute !important;top:var(--pg-m) !important;left:var(--pg-m) !important;
    right:var(--pg-m) !important;bottom:var(--pg-bar) !important;width:auto !important;height:auto !important;
    min-height:0 !important;max-height:none !important;margin:0 !important;
    overflow-x:hidden !important;overflow-y:auto !important;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.28) transparent;
    z-index:1;visibility:hidden;translate:0 130vh} /* parked off screen: IntersectionObserver reports it unseen */
  html.pg-deck main > section.pg-on,html.pg-deck main > section.pg-out,
  html.pg-deck:not(.pg-ready) main > section:first-of-type{visibility:visible;translate:none}
  html.pg-deck main > section.pg-on{z-index:2}
  html.pg-deck main > section.pg-out{z-index:3;pointer-events:none} /* the old sheet lifts off on top */
  /* the turn: the old sheet lifts and slides 24px while fading; the new one settles in underneath */
  html.pg-deck main > section.pg-anim{transition:transform .7s var(--ease-out),opacity .55s var(--ease-out),box-shadow .7s var(--ease-out)}
  html.pg-deck main > section.pg-in-f{transform:translate3d(24px,0,0)}
  html.pg-deck main > section.pg-in-b{transform:translate3d(-24px,0,0)}
  html.pg-deck main > section.pg-out-f{transform:translate3d(-24px,-6px,0);opacity:0;box-shadow:var(--pg-lift)}
  html.pg-deck main > section.pg-out-b{transform:translate3d(24px,-6px,0);opacity:0;box-shadow:var(--pg-lift)}
  /* builds: fade only, so a step never fights an element's own transform or translate */
  html.pg-deck main > section [data-step]{opacity:0;visibility:hidden;transition:opacity .6s var(--ease-out),visibility 0s linear .6s}
  html.pg-deck main > section [data-step].pg-shown{opacity:1;visibility:visible;transition:opacity .6s var(--ease-out),visibility 0s}

  /* ---- Stacked (FINAL): the same sheets one under another, every step shown ---- */
  html.arch-paged:not(.pg-deck) main{padding:var(--pg-m) var(--pg-m) 0}
  html.arch-paged:not(.pg-deck) main > section{height:calc(100vh - var(--pg-m) - var(--pg-bar)) !important;
    min-height:0 !important;max-height:none !important;margin:0 0 var(--pg-m) !important;overflow:hidden !important} /* hidden: the fit test counts the bottom padding, as in the deck */
  html.arch-paged:not(.pg-deck) main > section.pg-tall{height:auto !important;min-height:calc(100vh - var(--pg-m) - var(--pg-bar)) !important}

  /* ---- Fit levels, set by the script only on sheets that overflow (first level that fits wins) ----
     1 tighter type and spacing · 2 plus a 1000px column · 3 head beside visual · 4 that, tighter
     5 an 860px column · 6 a 760px column */
  html.arch-paged main > section[data-cps-fit].band{padding-top:clamp(22px,4vh,40px) !important;padding-bottom:clamp(22px,4vh,40px) !important}
  html.arch-paged main > section[data-cps-fit] h2{font-size:clamp(30px,3.3vw,46px)}
  html.arch-paged main > section[data-cps-fit] .lede{font-size:17px}
  html.arch-paged main > section[data-cps-fit] .band-head{gap:12px;margin-bottom:clamp(14px,2.6vh,28px)}
  html.arch-paged main > section[data-cps-fit="2"]{--wrap:1000px}
  html.arch-paged main > section[data-cps-fit="4"].band{padding-top:clamp(14px,2.4vh,24px) !important;padding-bottom:clamp(14px,2.4vh,24px) !important}
  html.arch-paged main > section[data-cps-fit="4"] h2{font-size:clamp(28px,2.8vw,40px)}
  html.arch-paged main > section[data-cps-fit="4"] h3{font-size:clamp(20px,1.8vw,24px)}
  html.arch-paged main > section[data-cps-fit="5"]{--wrap:860px}
  html.arch-paged main > section[data-cps-fit="6"]{--wrap:760px}
  html.arch-paged main > section .wrap.cps-split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);column-gap:clamp(28px,4vw,64px);align-items:center}
  html.arch-paged main > section .wrap.cps-split > *{margin-top:0 !important;margin-bottom:0 !important;min-width:0}

  /* ---- Controls: on the ground under the sheet, never over it ---- */
  .pg-bar{display:none}
  html.pg-deck .pg-bar{position:fixed;left:var(--pg-m);right:var(--pg-m);bottom:0;height:var(--pg-bar);z-index:10;
    display:flex;align-items:center;justify-content:space-between;gap:20px;color:var(--paper)}
  .pg-title{margin:0;min-width:0;flex:1 1 auto;font:500 11.5px/1.3 var(--font-label);letter-spacing:.08em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.62}
  .pg-ctl{display:flex;align-items:center;gap:14px;flex:none}
  .pg-count{margin:0;font:500 13px/1 var(--font-label);letter-spacing:.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pg-count span{opacity:.62}
  .pg-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .pg-dots{display:flex;gap:6px}
  .pg-dots i{width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);transition:background-color .3s var(--ease-out)}
  .pg-dots i.on{background:var(--paper);box-shadow:none}
  .pg-bar button{height:46px;border:0;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;
    font:600 15px/1 var(--font-body);-webkit-tap-highlight-color:transparent;
    transition:scale .15s ease-out,opacity .2s ease-out,box-shadow .3s var(--ease-out)}
  .pg-bar button:not(:disabled):active{scale:.96}
  .pg-bar button:disabled{opacity:.32;cursor:default}
  .pg-bar button:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
  .pg-bar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:rotate .25s var(--ease-out)}
  .pg-prev{width:46px;background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
  .pg-next{min-width:132px;padding:0 18px 0 22px;background:var(--paper);color:var(--ink)}
  .pg-next.pg-down svg{rotate:90deg}
  .pg-bar button.pg-nudge{box-shadow:0 0 0 4px rgba(255,255,255,.4)}
  .pg-prev.pg-nudge{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4),0 0 0 4px rgba(255,255,255,.4)}
  @media (max-width:899px){.pg-dots{display:none}}

  @media print{
    html.pg-deck main{position:static;overflow:visible}
    html.pg-deck main > section{position:relative !important;inset:auto !important;height:auto !important;visibility:visible;translate:none;
      transform:none;opacity:1;overflow:visible !important;box-shadow:none;break-after:page}
    html.pg-deck main > section [data-step]{opacity:1;visibility:visible}
    html.pg-deck .pg-bar{display:none}
  }
</style>

<nav class="pg-bar" aria-label="Pages">
  <p class="pg-title" aria-hidden="true"></p>
  <div class="pg-ctl">
    <span class="pg-dots" aria-hidden="true"></span>
    <p class="pg-count" aria-live="polite"><span class="pg-sr">Page </span><b class="pg-now">01</b><span> / </span><span class="pg-all">01</span></p>
    <button class="pg-prev" type="button" aria-label="Previous page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></button>
    <button class="pg-next" type="button"><span class="pg-next-label">Next</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
  </div>
</nav>

<script>
(() => {
  const root = document.documentElement, deck = !FINAL;
  root.classList.add('arch-paged');
  if (deck) root.classList.add('pg-deck');

  /* Deep link before the first paint: show sheet N instead of sheet 1 */
  const want = /^#page-(\d+)$/.exec(location.hash);
  if (deck && want && +want[1] > 1) {
    const st = document.createElement('style');
    st.textContent = `html.pg-deck:not(.pg-ready) main>section:first-of-type{visibility:hidden;translate:0 130vh}
      html.pg-deck:not(.pg-ready) main>section:nth-of-type(${+want[1]}){visibility:visible;translate:none}`;
    document.head.appendChild(st);
  }

  /* Reveal: the starter's observer skips the bottom 12% of the screen, where a sheet's lower edge sits.
     On a deck the whole screen counts; waiting sheets are off screen, so blocks reveal when their sheet arrives. */
  if (deck && typeof initReveal === 'function') {
    removeEventListener('DOMContentLoaded', initReveal);
    addEventListener('DOMContentLoaded', () => {
      const els = $$('.rv');
      if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
      const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }));
      els.forEach(e => io.observe(e));
    });
  }

  addEventListener('DOMContentLoaded', () => {
    const main = $('main'), bar = $('.pg-bar');
    const sheets = main ? $$(':scope > section', main) : [], N = sheets.length;
    if (!N || !bar) return;
    const ev = (el, name, detail) => el.dispatchEvent(new CustomEvent(name, { bubbles: true, detail }));
    const stepOf = e => +e.dataset.step || 0;
    const steps = sheets.map(s => $$('[data-step]', s).reduce((m, e) => Math.max(m, stepOf(e)), 0));
    const titleOf = s => (s.dataset.title || ($('h2', s) || $('h1', s) || {}).textContent || s.getAttribute('aria-label') || '').replace(/\s+/g, ' ').trim();
    const pad = n => String(n).padStart(2, '0');
    const more = s => s.scrollTop + s.clientHeight < s.scrollHeight - 8;
    const nextBtn = $('.pg-next', bar), prevBtn = $('.pg-prev', bar), nextLabel = $('.pg-next-label', bar);
    const nowEl = $('.pg-now', bar), titleEl = $('.pg-title', bar), dots = $('.pg-dots', bar);
    $('.pg-all', bar).textContent = pad(N);
    dots.innerHTML = sheets.map(() => '<i></i>').join('');
    let cur = -1, step = 0, leaving = null, timer = 0, update = () => {};

    /* ---- Fit: first level that fits wins; otherwise the sheet scrolls (deck) or grows (stacked) ---- */
    const SPLIT = [3, 4];
    const kids = w => w ? [...w.children].filter(k => !/^(STYLE|SCRIPT|TEMPLATE)$/.test(k.tagName) && getComputedStyle(k).position !== 'absolute') : [];
    /* head beside visual is skipped when the visual places HTML text by % (it would wrap and collide),
       or when a fit rule sets --cps-split: no on the section */
    const splitOk = (s, vis) => getComputedStyle(s).getPropertyValue('--cps-split').trim() !== 'no' &&
      ![...vis.querySelectorAll('*')].some(n => !(n instanceof SVGElement) && getComputedStyle(n).position === 'absolute' && n.textContent.trim().length > 12);
    function fitAll() {
      const land = innerWidth / innerHeight > 1.15;
      sheets.forEach(s => {
        const w = s.querySelector(':scope > .wrap'), k = kids(w), canSplit = land && k.length === 2 && splitOk(s, k[1]);
        const set = lv => { if (lv) s.dataset.cpsFit = lv; else delete s.dataset.cpsFit; if (w) w.classList.toggle('cps-split', SPLIT.includes(lv)); };
        const fits = () => s.scrollHeight - s.clientHeight <= 2;
        s.classList.remove('pg-tall'); set(0);
        if (fits()) return;
        for (const lv of [1, 2, 3, 4, 5, 6]) { if (SPLIT.includes(lv) && !canSplit) continue; set(lv); if (fits()) return; }
        set(0); if (!deck) s.classList.add('pg-tall');
      });
      if (cur >= 0) update();
    }

    if (!deck) {   /* stacked: every step shown by the CSS; tell modules each sheet is in its finished state */
      fitAll();
      sheets.forEach((s, i) => { ev(s, 'cps:enter', { index: i, total: N, dir: 1 }); if (steps[i]) ev(s, 'cps:step', { step: steps[i], steps: steps[i] }); });
    } else {
      const show = (s, n) => $$('[data-step]', s).forEach(e => e.classList.toggle('pg-shown', stepOf(e) <= n));
      const park = s => { s.classList.remove('pg-on', 'pg-out', 'pg-anim', 'pg-in-f', 'pg-in-b', 'pg-out-f', 'pg-out-b'); s.inert = true; s.setAttribute('aria-hidden', 'true'); };
      const settle = () => { clearTimeout(timer); if (leaving) { park(leaving); leaving = null; } if (cur >= 0) sheets[cur].classList.remove('pg-anim'); };
      const nudge = b => { if (b.classList.contains('pg-nudge')) return; b.classList.add('pg-nudge'); setTimeout(() => b.classList.remove('pg-nudge'), 900); };

      update = () => {
        const s = sheets[cur], built = step >= steps[cur], down = built && more(s);
        nowEl.textContent = pad(cur + 1);
        [...dots.children].forEach((d, i) => d.classList.toggle('on', i === cur));
        titleEl.textContent = titleOf(s);
        prevBtn.disabled = cur === 0 && step === 0 && s.scrollTop <= 8;
        const end = cur === N - 1 && built && !down;
        nextBtn.disabled = end;
        nextLabel.textContent = end ? 'End' : down ? 'More' : 'Next';
        nextBtn.classList.toggle('pg-down', down);
      };

      function go(n, { dir, built = false, instant = false, target = null } = {}) {
        n = Math.max(0, Math.min(N - 1, n));
        if (n === cur) return;
        if (dir === undefined) dir = n > cur ? 1 : -1;
        settle();
        const from = cur >= 0 ? sheets[cur] : null, to = sheets[n];
        if (from) ev(from, 'cps:leave', { index: cur, total: N, dir });
        step = built ? steps[n] : 0; show(to, step);
        to.inert = false; to.removeAttribute('aria-hidden');
        if (from && !instant) {
          to.classList.add('pg-on', dir > 0 ? 'pg-in-f' : 'pg-in-b');
          from.classList.remove('pg-on'); from.classList.add('pg-out'); from.inert = true;
          to.scrollTop = 0;
          void to.offsetWidth;                     /* commit the start position, then let both sheets move */
          to.classList.add('pg-anim'); from.classList.add('pg-anim');
          to.classList.remove('pg-in-f', 'pg-in-b');
          from.classList.add(dir > 0 ? 'pg-out-f' : 'pg-out-b');
          leaving = from; timer = setTimeout(settle, 780);
        } else {
          sheets.forEach(s => { if (s !== to) park(s); });
          to.classList.add('pg-on');
        }
        cur = n; to.scrollTop = 0;
        if (target && target !== to) to.scrollTop = Math.max(0, target.getBoundingClientRect().top - to.getBoundingClientRect().top - 24);
        ev(to, 'cps:enter', { index: n, total: N, dir });
        if (steps[n]) ev(to, 'cps:step', { step, steps: steps[n] });
        update();
        if (from) try { history.replaceState(null, '', '#page-' + (n + 1)); } catch (e) {}
        dispatchEvent(new Event('scroll'));       /* scroll-listening helpers re-measure the new sheet */
      }
      function setStep(n) {
        const s = sheets[cur]; step = n; show(s, n);
        ev(s, 'cps:step', { step: n, steps: steps[cur] });
        const fresh = $$('[data-step]', s).filter(e => stepOf(e) === n);
        if (fresh.length) {   /* a new step below the fold scrolls into view inside the sheet */
          const b = Math.max(...fresh.map(e => e.getBoundingClientRect().bottom)), r = s.getBoundingClientRect();
          if (b > r.bottom - 16) s.scrollBy({ top: b - r.bottom + 32, behavior: 'smooth' });
        }
        update();
      }
      function next(scrollFirst = true) {
        const s = sheets[cur];
        if (step < steps[cur]) return setStep(step + 1);
        if (scrollFirst && more(s)) return s.scrollBy({ top: s.clientHeight * .8, behavior: 'smooth' });
        if (cur < N - 1) go(cur + 1, { dir: 1 }); else nudge(nextBtn);
      }
      function prev(scrollFirst = true) {
        const s = sheets[cur];
        if (scrollFirst && s.scrollTop > 8) return s.scrollBy({ top: -s.clientHeight * .8, behavior: 'smooth' });
        if (step > 0) return setStep(step - 1);
        if (cur > 0) go(cur - 1, { dir: -1, built: true }); else nudge(prevBtn);
      }
      function fromHash() {
        let h = location.hash.slice(1); try { h = decodeURIComponent(h); } catch (e) {}
        if (!h) return null;
        const m = /^page-(\d+)$/.exec(h);
        if (m) return { i: Math.max(0, Math.min(N - 1, +m[1] - 1)), el: null };
        const el = document.getElementById(h), i = el ? sheets.findIndex(s => s.contains(el)) : -1;
        return i < 0 ? null : { i, el };
      }

      /* Start */
      sheets.forEach(park);
      const t0 = fromHash();
      go(t0 ? t0.i : 0, { instant: true, target: t0 && t0.el });
      root.classList.add('pg-ready');
      fitAll();

      nextBtn.addEventListener('click', () => next());
      prevBtn.addEventListener('click', () => prev());
      addEventListener('hashchange', () => { const t = fromHash(); if (t && t.i !== cur) go(t.i, { target: t.el }); });
      addEventListener('keydown', e => {
        if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
        const t = e.target, k = e.key;
        if (t.closest && t.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"])')) return;
        if ((k === ' ' || k === 'Enter') && t.closest && t.closest('button, a[href], summary')) return;
        const s = sheets[cur];
        let f = null;
        if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && !e.shiftKey)) f = () => next();
        else if (k === 'ArrowLeft' || k === 'PageUp' || (k === ' ' && e.shiftKey)) f = () => prev();
        else if (k === 'ArrowDown') f = () => more(s) ? s.scrollBy({ top: 64 }) : next();
        else if (k === 'ArrowUp') f = () => s.scrollTop > 0 ? s.scrollBy({ top: -64 }) : prev();
        else if (k === 'Home') f = () => go(0);
        else if (k === 'End') f = () => go(N - 1, { built: true });
        if (f) { e.preventDefault(); f(); }
      });
      /* swipe sideways turns the page; swiping up and down scrolls a tall sheet as usual */
      let tx = null, ty = 0, tt = 0;
      main.addEventListener('touchstart', e => { if (e.touches.length !== 1) { tx = null; return; } tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now(); }, { passive: true });
      main.addEventListener('touchend', e => {
        if (tx === null) return;
        const p = e.changedTouches[0], dx = p.clientX - tx, dy = p.clientY - ty; tx = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4 && Date.now() - tt < 900) dx < 0 ? next(false) : prev(false);
      }, { passive: true });
      /* the wheel never turns pages; at a sheet's end it points at the button that does */
      main.addEventListener('wheel', e => {
        if (Math.abs(e.deltaY) < 4) return;
        const s = sheets[cur];
        if (e.deltaY > 0 ? !more(s) : s.scrollTop <= 0) nudge(e.deltaY > 0 ? nextBtn : prevBtn);
      }, { passive: true });
      let raf = 0;
      sheets.forEach(s => s.addEventListener('scroll', () => {
        if (raf) return;
        raf = requestAnimationFrame(() => { raf = 0; update(); dispatchEvent(new Event('scroll')); });
      }, { passive: true }));
      window.CPS = { arch: 'paged', go: n => go(n), next: () => next(), prev: () => prev(), index: () => cur };
    }

    let rt = 0;
    addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fitAll, 150); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
    addEventListener('load', fitAll);
  });
})();
</script>
