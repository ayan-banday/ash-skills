<!-- =====================================================================
  ARCHITECTURE SHELL: SCROLL, the default
  One long vertical page: every top-level <section> is a colour band, read top to bottom. This is what the
  starter already does, so it needs no shell. This file exists so the three architectures sit side by side
  in assets/architectures/; dropping it in as work/frag-00-arch.html changes nothing.
  The other two shells (paged.html, horizontal.html) dispatch cps:enter, cps:leave and cps:step events;
  this one dispatches none, so a section must never depend on those events to show its content.
  ===================================================================== -->
