<title>Coastline Cold Chain proposal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Prototype output of pitch-site-udyaan: a sample proposal from Tidewater Studio to Coastline Cold Chain, drawn as an engineering drawing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== Tokens: Drafting direction ("the engineering drawing") ===== */
  :root{
    --ground:#2B2927; --ground-2:#393633; --paper:#F0EDE5; --card:#F9F8F4;
    --ink:#22201E; --muted:#64605B; --line:rgba(34,32,30,.14); --line-2:rgba(34,32,30,.28);
    --tint-1:#C6D3E2; --tint-2:#EDE0B8; --tint-3:#EBC6C0; --tint-4:#D9D2E6;
    --marker:#F4D54E; --marker-ink:#A87410; --red:#B3322E; --cyan:#23508E;
    --font-display:'Barlow Condensed',sans-serif; --font-body:'IBM Plex Sans',sans-serif;
    --font-label:'IBM Plex Mono',monospace; --font-hand:'Architects Daughter',cursive;
    --ease-out:cubic-bezier(.22,1,.36,1); --ease-draw:cubic-bezier(.45,.05,.35,1);
    --wrap:1180px; --gutter:clamp(20px,4vw,48px);
    --r-sheet:2px; /* drafting sheets have near-square corners; only real devices (a tablet) get a big radius */
    color-scheme:light;
  }
  /* Single deliberate theme: vellum paper with graphite bands. No dark blocks; every colour is set explicitly. */

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:clip}
  /* vellum tooth: static, never animated */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.05;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  img,svg{max-width:100%}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:-.005em;line-height:1.02;margin:0;text-wrap:balance}
  h1{font-size:clamp(48px,6.4vw,92px)}
  h2{font-size:clamp(38px,4.6vw,64px)}
  h3{font-size:clamp(24px,2.2vw,30px);line-height:1.1}
  p{margin:0;text-wrap:pretty}
  .lede{font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:var(--muted);max-width:56ch}
  .label{font:500 11.5px/1.3 var(--font-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .hand{font-family:var(--font-hand);color:var(--red)}
  .wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}

  /* Section colour blocks: one flat block per idea */
  .band{position:relative;padding:clamp(88px,11vw,150px) 0;overflow-x:clip}
  .band.paper{background:var(--paper)} .band.card{background:var(--card)}
  .band.t1{background:var(--tint-1)} .band.t2{background:var(--tint-2)} .band.t3{background:var(--tint-3)}
  /* contrast: muted and red re-tuned per tint so text stays at 4.5:1 or better */
  .band.t1,.band.t3{--muted:#57534E;--red:#952622}
  .band.dark{background:var(--ground);color:var(--paper)}
  .band.dark .lede,.band.dark .label{color:rgba(240,237,229,.72)}
  .band-head{display:grid;gap:18px;margin-bottom:clamp(40px,5vw,64px);max-width:760px}

  /* Team chips: one tint per team, used everywhere that team appears */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--font-label);letter-spacing:.04em;padding:6px 9px;border-radius:3px;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(34,32,30,.12)}
  .chip.c-sensors{background:var(--tint-1)} .chip.c-app{background:var(--tint-2)}
  .chip.c-data{background:var(--tint-3)} .chip.c-field{background:var(--tint-4)}

  /* Marker: keep <mark> inside inline text, never as a grid/flex child */
  mark{background:linear-gradient(var(--marker),var(--marker)) no-repeat 0 90%/0% 42%;color:inherit;padding:0 2px;
    -webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .8s var(--ease-out) .35s}
  .in mark, mark.in{background-size:100% 42%}
  .band.dark mark{background-image:linear-gradient(var(--marker),var(--marker));color:var(--ink);border-radius:3px;padding:1px 5px;background-position:0 0;background-size:0% 100%}
  .band.dark .in mark,.band.dark mark.in{background-size:100% 100%}

  /* Reveal: only blocks below the fold start hidden; text plays once */
  .js .rv{opacity:0;transform:translateY(12px);transition:opacity .8s var(--ease-out),transform .8s var(--ease-out);transition-delay:var(--d,0s)}
  .js .rv.in{opacity:1;transform:none}

  /* Drawing classes shared by every SVG (ISO-ish line weights) */
  .ln{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ln.thin{stroke-width:.8} .ln.hid{stroke-width:1;stroke-dasharray:6 4}
  .ln.cl{stroke-width:.7;stroke-dasharray:16 4 3 4;opacity:.7}
  .ln.guide{stroke-width:1;stroke-dasharray:3 5;opacity:.3}
  .ln.red{stroke:var(--red)} .ln.cyan{stroke:var(--cyan)}
  .fill-paper{fill:var(--paper)} .fill-card{fill:var(--card)}
  .svg-label{font:500 11px var(--font-label);letter-spacing:.06em;fill:var(--ink)}
  .svg-hand{font:16px var(--font-hand);fill:var(--red)}

  /* Buttons */
  .btn{font:600 14px/1 var(--font-body);padding:12px 18px;border-radius:10px;border:0;background:var(--ink);color:var(--paper);cursor:pointer;
    transition:scale .15s ease-out;-webkit-tap-highlight-color:transparent;min-width:140px}
  .btn:not(:disabled):active{scale:.96}

  /* Phone gate: short side under 540px sees only this */
  .gate{display:none}
  @media (max-width:539px), (pointer:coarse) and (max-height:499px){ html:not(.no-gate) main{display:none} html:not(.no-gate) .gate{display:grid} }
  html.phone main{display:none} html.phone .gate{display:grid}
  .gate{min-height:100svh;place-items:center;text-align:center;padding:32px;background:var(--ground);color:var(--paper)}
  .gate p{font:600 34px/1.05 var(--font-display);max-width:12ch;margin:18px auto 10px}
  .gate small{font:400 15px/1.5 var(--font-body);color:rgba(240,237,229,.7)}

  @media (prefers-reduced-motion: reduce){ .js .rv{opacity:1;transform:none;transition:none} mark{transition:none;background-size:100% 42%} }
</style>
<script>
  /* ===== Shared helpers (every section fragment may use these) ===== */
  document.documentElement.classList.add('js');
  try { if (navigator.maxTouchPoints > 0 && Math.min(screen.width, screen.height) < 540) document.documentElement.classList.add('phone'); } catch (e) {}
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* ?final=1 forces every finished state (screenshots; hidden panes throttle animation) */
  const FINAL = reduce || /[?&]final=1/.test(location.search);
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];

  /* Run fn once when el is threshold-visible. Under FINAL it runs at once. */
  function onView(el, fn, threshold = .3) {
    if (!el) return;
    if (FINAL || !('IntersectionObserver' in window)) { fn(); return; }
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.disconnect(); fn(); } }), { threshold });
    io.observe(el);
  }
  /* Hide paths so they can be pen-drawn later. */
  function prepDraw(paths) {
    paths.forEach(p => { const L = p.getTotalLength ? p.getTotalLength() : 0; p.style.strokeDasharray = L + ' ' + L; p.style.strokeDashoffset = FINAL ? 0 : L; p.dataset.len = L; });
  }
  /* House pen rule: duration = length / speed, clamped .6-2.2s; next stroke starts at 82% of the previous.
     parallel:true starts every path at once. Returns the time (s) when the set is done enough to chain. */
  function penDraw(paths, { delay = 0, speed = 600, overlap = .82, parallel = false, min = .6, max = 2.2 } = {}) {
    let t = delay, end = delay;
    paths.forEach(p => {
      const L = +p.dataset.len || p.getTotalLength();
      const d = Math.min(max, Math.max(min, L / speed));
      if (!p.dataset.len) { p.style.strokeDasharray = L + ' ' + L; p.style.strokeDashoffset = L; p.dataset.len = L; }
      if (FINAL) { p.style.strokeDashoffset = 0; return; }
      p.getBoundingClientRect();
      p.style.transition = `stroke-dashoffset ${d}s var(--ease-draw) ${parallel ? delay : t}s`;
      requestAnimationFrame(() => { p.style.strokeDashoffset = 0; });
      if (parallel) end = Math.max(end, delay + d * overlap); else { t += d * overlap; end = t; }
    });
    return end;
  }
  /* Reveal blocks marked .rv; the ones already on screen at load show at once. */
  function initReveal() {
    const els = $$('.rv');
    if (FINAL || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -12% 0px' });
    els.forEach(e => io.observe(e));
  }
  addEventListener('DOMContentLoaded', initReveal);

  /* ===== The motif: Coastline's refrigerated truck as an engineering drawing =====
     viewBox 0 0 900 440. Parts are named so sections can light one part (badges) or x-ray it (stage). */
  const TRUCK = {
    ground: 'M40 330H860',
    cl: 'M170 252V348M585 252V348M680 252V348M118 300H732',
    chassis: 'M70 270H786V282H70Z M300 284H384V306H300Z',
    cab: 'M222 268V118H130Q114 118 106 132L80 184Q76 192 76 202V268Z M208 132H134L114 178H208Z M152 186V258 M192 200H204 M64 248H80V270H64Z M72 212H82V224H72Z',
    box: 'M238 266V92H782V266Z M238 92V58H306V92 M248 68H296M248 76H296M248 84H296',
    ribs: (() => { let d = ''; for (let x = 276; x <= 690; x += 38) d += `M${x} 96V262`; return d; })(),
    door: 'M712 100V258H774V100Z M730 112V246M756 112V246 M705 140H712M705 220H712',
    wheels: [170, 585, 680].map(x => `M${x - 30} 300a30 30 0 1 0 60 0a30 30 0 1 0 -60 0 M${x - 19} 300a19 19 0 1 0 38 0a19 19 0 1 0 -38 0 M${x - 6} 300a6 6 0 1 0 12 0a6 6 0 1 0 -12 0`).join(' '),
    hatch: (() => { let d = ''; for (let y = 92; y <= 252; y += 8) d += `M238 ${y + 14}L252 ${y}`; return d; })(),
    dim: 'M76 392H782',
    ext: 'M76 276V402 M782 276V402',
    tb: 'M540 404H884V438H540Z M540 421H884 M712 404V438 M806 404V438',
    /* cargo for the x-ray: 4 x 3 crates; the warm one is index 7 (nearest the door, middle row) */
    crates: (() => { const out = []; [108, 158, 208].forEach(y => [262, 366, 470, 574].forEach(x => out.push(`M${x} ${y}h94v44h-94Z M${x} ${y + 22}h94`))); return out; })(),
    warm: 7,
    sensors: { box: [470, 104], door: [712, 180], cab: [178, 150] },
    route: { from: [76, 392], to: [782, 392] }
  };
  /* Build the static truck into an <svg> (or <g>). opts.parts limits which parts; opts.cls adds classes per part. */
  function drawTruck(target, { parts = ['ground', 'cl', 'chassis', 'cab', 'box', 'ribs', 'door', 'wheels', 'ext', 'dim', 'tb'], cls = {}, labels = true } = {}) {
    const weight = { ground: 'ln thin', cl: 'ln cl', chassis: 'ln', cab: 'ln', box: 'ln', ribs: 'ln thin', door: 'ln', wheels: 'ln', hatch: 'ln thin', dim: 'ln thin', ext: 'ln thin', tb: 'ln' };
    const made = {};
    parts.forEach(k => {
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', TRUCK[k]); p.setAttribute('class', `${weight[k] || 'ln'} t-${k} ${cls[k] || ''}`.trim());
      if (k === 'dim') { p.setAttribute('marker-start', 'url(#arr)'); p.setAttribute('marker-end', 'url(#arr)'); }
      target.appendChild(p); made[k] = p;
    });
    if (labels && parts.includes('dim')) target.insertAdjacentHTML('beforeend', `<text class="svg-label t-dimtext" x="429" y="386" text-anchor="middle">KOCHI TO BENGALURU, ONE NIGHT</text>`);
    if (labels && parts.includes('tb')) target.insertAdjacentHTML('beforeend',
      `<g class="t-tbtext"><text class="svg-label" x="548" y="416" style="font-size:8.5px">CLIENT</text><text class="svg-label" x="548" y="433" style="font-size:9.5px">COASTLINE COLD CHAIN</text>
       <text class="svg-label" x="720" y="416" style="font-size:8.5px">DRAWN BY</text><text class="svg-label" x="720" y="433" style="font-size:9.5px">TIDEWATER</text>
       <text class="svg-label" x="814" y="416" style="font-size:8.5px">SHEET</text><text class="svg-label" x="814" y="433" style="font-size:9.5px">PROPOSAL A</text></g>`);
    return made;
  }
  /* Small badge: the whole truck faint, one part ('box' | 'cab' | 'trip') in redline. Returns SVG markup. */
  function truckBadge(part) {
    const lit = { box: ['box', 'door'], cab: ['cab'], trip: ['dim', 'ext'] }[part] || [];
    const keys = ['cab', 'box', 'door', 'chassis', 'wheels', 'ext', 'dim'];
    const paths = keys.map(k => `<path d="${TRUCK[k]}" class="ln ${lit.includes(k) ? 'red' : ''}" style="stroke-width:${lit.includes(k) ? 9 : 5};opacity:${lit.includes(k) ? 1 : .35}"/>`).join('');
    return `<svg class="badge" viewBox="40 40 790 380" role="img" aria-label="The truck drawing with the ${part} highlighted">${paths}</svg>`;
  }
</script>

<!-- Shared SVG defs: arrowheads and the graphite pencil filter. Not display:none, or markers and filters break. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 2L10 5L0 8Z" fill="#22201E"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 2L10 5L0 8Z" fill="#B3322E"/></marker>
    <filter id="graphite" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale=".9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="gate" role="dialog" aria-label="Open on a larger screen">
  <div>
    <svg viewBox="0 0 120 80" width="120" aria-hidden="true"><path class="ln" style="stroke:var(--marker)" d="M20 14h80v46H20zM8 66h104"/></svg>
    <p>Open this on your laptop or tablet</p>
    <small>This proposal is built for a bigger screen.</small>
  </div>
</div>

<main>
<!--@@SECTIONS-->
</main>
